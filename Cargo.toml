[package]
name = "agentrt-tui"
# 版本 SSoT（T-06）：二进制内展示版本由 build.rs 经 AIRY_RT_VERSION_FILE 注入
# agentrt/VERSION；此字段须与产品版本同步 bump，仅作 crate 元数据兜底。
version = "0.1.15"
edition = "2021"
description = "AgentRT TUI - Terminal User Interface for AgentRT intelligent agent runtime"
license = "AGPL-3.0-or-later OR Apache-2.0"
repository = "https://github.com/openairymax/agentrt"
authors = ["SPHARX Ltd."]

[[bin]]
name = "agentrt-tui"
path = "src/main.rs"

[features]
# T-09（0.1.15 裁决）：收回 TUI 对运行时库的一切 FFI 直连——
# memoryrovol feature 已删除（记忆读写走 gateway mem.* RPC + 本地
# JsonlMemory 会话缓存）；ime 保留为空开关，仅维持 src 中
# all(feature = "ime", ime_linked) 双门控的天然休眠（build.rs 不再
# 置位 ime_linked，内置拼音 IME 禁用，输入交回终端/OS 输入法）。
default = []
ime = []

[dependencies]
# TUI framework
ratatui = "0.28"
crossterm = "0.28"

# HTTP client for gateway communication
# default-features=false：禁用默认 native-tls（openssl），改用纯 Rust rustls，
# 消除运行时 libssl 依赖，x86/ARM/RISC-V 与 Windows/macOS 交叉编译一致。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Channel for async communication
tokio-stream = "0.1"
futures = "0.3"

# Terminal size detection
unicode-width = "0.1"

[dev-dependencies]
# 记忆模块单测：临时目录
tempfile = "3"

# T-18 生产路径 unwrap/expect 清单门禁（0.1.15 WS-6 6.5）：
# 生产代码禁止无论证 unwrap/expect（fail-closed）；测试与 build.rs 的
# 分级豁免见 clippy.toml。新增例外须就地 #[allow] 并注明不变量与守护测试。
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# 制品体积控制（2.11.3）：release 二进制 strip 符号表，
# agentrt-tui 由 ~11MB 降至 ~4MB；保持 panic=unwind 以便错误可观测。
[profile.release]
strip = true