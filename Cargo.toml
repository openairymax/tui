[package]
name = "agentrt-tui"
version = "0.1.2"
edition = "2021"
description = "AgentRT TUI - Terminal User Interface for AgentRT intelligent agent runtime"
license = "AGPL-3.0-or-later OR Apache-2.0"
repository = "https://github.com/spharx/agentrt"
authors = ["SPHARX Ltd."]

[[bin]]
name = "agentrt-tui"
path = "src/main.rs"

[features]
# IRON-8：MemoryRovol（L1-L4 四层记忆卷载）为默认记忆后端。
# 构建时由 build.rs 定位 libagentrt_memoryrovol.a：
#   MEMORYROVOL_LIB env → $AIRY_HOME/lib/libagentrt_memoryrovol.a → 伞仓构建产物
# 库缺失时 FFI 不编译，运行时优雅降级 JsonlMemory（真实可用后备）。
default = ["memoryrovol"]
memoryrovol = ["dep:libc"]

[dependencies]
# TUI framework
ratatui = "0.28"
crossterm = "0.28"

# HTTP client for gateway communication
# default-features=false：禁用默认 native-tls（openssl），改用纯 Rust rustls，
# 消除运行时 libssl 依赖，x86/ARM/RISC-V 与 Windows/macOS 交叉编译一致。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Channel for async communication
tokio-stream = "0.1"
futures = "0.3"

# Terminal size detection
unicode-width = "0.1"

# C FFI（仅 memoryrovol feature 启用时使用）
libc = { version = "0.2", optional = true }

[dev-dependencies]
# 记忆模块单测：临时目录
tempfile = "3"

# 制品体积控制（2.11.3）：release 二进制 strip 符号表，
# agentrt-tui 由 ~11MB 降至 ~4MB；保持 panic=unwind 以便错误可观测。
[profile.release]
strip = true