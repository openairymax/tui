name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: License check
        run: |
          if [ -f "LICENSE" ]; then
            echo "[OK] LICENSE present"
          else
            echo "[NO] LICENSE missing" && exit 1
          fi

      - name: README check
        run: |
          if [ -f "README.md" ] || [ -f "README_zh.md" ]; then
            echo "[OK] README present"
          else
            echo "[WARN] README missing"
          fi

      - name: NOTICE check
        run: |
          if [ -f "NOTICE" ]; then
            echo "[OK] NOTICE present"
          else
            echo "[WARN] NOTICE missing"
          fi

      - name: Cargo build check
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo build --release 2>&1 || echo "[WARN] cargo build failed (may need cross-module deps)"
          else
            echo "[INFO] No Cargo.toml, skipping build"
          fi
