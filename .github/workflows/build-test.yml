# agentrt-tui 构建与测试流水线。
#
# 门禁定位：多字节字符边界、终端状态 panic 注入恢复与真实对话回放
# （agent.run_stream v1 消费链：中文长回复 / 错误帧 / 中断帧 / 网络分片）
# 全部在本流水线实际执行，任一失败即阻断合并（required）。
#
# 布局约束：
#   - 源码按 sdk 管理仓的真实相对布局取放：sdk/tui 与 sdk/sdk-rust 必须
#     邻接，以满足 tui 对共享协议客户端 agentrt-rs 的 path 依赖
#     ../sdk-rust（actions/checkout 不允许工作区之外的路径）；
#   - CARGO_TARGET_DIR 指向源码树之外，构建产物不落在仓库内；
#   - wire 常量唯源 C 头 commons/include/airy_run_stream.h，由 agentrt-rs
#     的 build.rs fail-closed 生成；版本 SSoT 为 agentrt/VERSION。二者以
#     并行 checkout 精确取得（agentrt 为 superproject，公共 runner 无
#     私有子模块凭据，故不取 submodules）。

name: build-test

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build-test:
    # 主力腿：全部单测 + 回放回归 + clippy 静态检查（经 [lints.clippy]
    # 含生产路径 unwrap/expect 门禁，fail-closed），required。
    name: linux / stable / test+clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/airymaxtui-build
      AGENTRT_RS_RUN_STREAM_H: ${{ github.workspace }}/agentrt/commons/include/airy_run_stream.h
      AIRY_RT_VERSION_FILE: ${{ github.workspace }}/agentrt/VERSION
    steps:
      - name: Checkout tui
        uses: actions/checkout@v4
        with:
          path: sdk/tui

      # 共享协议客户端（tui 的 path 依赖 ../sdk-rust）
      - name: Checkout agentrt-rs
        uses: actions/checkout@v4
        with:
          repository: openairymax/sdk-rust
          ref: main
          path: sdk/sdk-rust

      # 版本 SSoT（agentrt/VERSION）
      - name: Checkout agentrt
        uses: actions/checkout@v4
        with:
          repository: openairymax/agentrt
          ref: main
          path: agentrt

      # 协议 schema SSoT（commons/include/airy_run_stream.h）
      - name: Checkout commons
        uses: actions/checkout@v4
        with:
          repository: openairymax/commons
          ref: main
          path: agentrt/commons

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/tui

      - name: Build
        working-directory: sdk/tui
        run: cargo build --workspace

      - name: Test
        working-directory: sdk/tui
        run: cargo test --workspace

      - name: Clippy
        working-directory: sdk/tui
        run: cargo clippy --workspace --all-targets -- -D warnings

  macos-build-test:
    # 终端用户面 macOS 腿：编译 + 全部测试（crossterm/ratatui 跨平台
    # 行为与输入回退路径验证），required。
    name: macos / stable / test
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: /tmp/airymaxtui-build
      AGENTRT_RS_RUN_STREAM_H: ${{ github.workspace }}/agentrt/commons/include/airy_run_stream.h
      AIRY_RT_VERSION_FILE: ${{ github.workspace }}/agentrt/VERSION
    steps:
      - name: Checkout tui
        uses: actions/checkout@v4
        with:
          path: sdk/tui

      - name: Checkout agentrt-rs
        uses: actions/checkout@v4
        with:
          repository: openairymax/sdk-rust
          ref: main
          path: sdk/sdk-rust

      - name: Checkout agentrt
        uses: actions/checkout@v4
        with:
          repository: openairymax/agentrt
          ref: main
          path: agentrt

      - name: Checkout commons
        uses: actions/checkout@v4
        with:
          repository: openairymax/commons
          ref: main
          path: agentrt/commons

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/tui

      - name: Build
        working-directory: sdk/tui
        run: cargo build --workspace

      - name: Test
        working-directory: sdk/tui
        run: cargo test --workspace
